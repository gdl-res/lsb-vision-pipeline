# Segmenter configuration: which larva segmentation models can be swapped in.
#
# Read by scripts/train_segmenter.py, scripts/train_maskrcnn.py,
# scripts/cache_detections.py (--segmenter NAME) and
# scripts/replay_trackers.py (--config-prefix / --all-segmenters).
# Detection thresholds, replay settings and the downstream chain are inherited
# from `base_config`, so every segmenter runs under identical settings.

experiment_id: segmenters

layout:
  rows: 3
  cols: 2
base_config: config/replay.yaml

paths:
  videos: data/videos
  # YOLO-seg dataset (full tray images) used for training
  dataset: data/larva_dataset
  # run_pipeline.py output for the same videos: frozen arena geometry
  production_dataset: outputs/my_dataset
  # Petri-crop version of `dataset`, built with scripts/process_dataset_splits.py
  crop_dataset: outputs/crop_dataset
  pretrained: weights/pretrained
  out: outputs/segmenters

# --- training protocol (ultralytics models) --------------------------------- #
training:
  imgsz: 640
  epochs: 300
  patience: 32
  batch: 16
  seed: 0
  deterministic: true
  workers: 6
  cache: disk

# --- segmenters ------------------------------------------------------------- #
# backend: ultralytics (any YOLO-seg checkpoint) or torchvision_maskrcnn.
# trained_here: true lets train_segmenter.py / train_maskrcnn.py produce
# `weights` from `pretrained` (and optionally a model-specific `dataset`).
segmenters:
  production:
    backend: ultralytics
    weights: weights/larva.pt
    imgsz: 640
    cache_dir: outputs/detection_cache
    trained_here: false
  yolo11s_crop:
    # YOLO11s-seg trained on Petri crops (the input the pipeline feeds it)
    backend: ultralytics
    pretrained: weights/pretrained/yolo11s-seg.pt
    dataset: outputs/crop_dataset
    weights: weights/larva_yolo11s_crop.pt
    imgsz: 640
    cache_dir: outputs/segmenters/cache/yolo11s_crop
    trained_here: true
  maskrcnn:
    backend: torchvision_maskrcnn
    weights: weights/larva_maskrcnn.pt
    imgsz: 640
    cache_dir: outputs/segmenters/cache/maskrcnn
    trained_here: true

# segmenter whose cache --regression-check compares against
reference_segmenter: production
methods: [bytetrack, nearest]
gates: [gate_on]

# --- optional: --runtime-guard budget for long cache passes ------------------ #
# cache_runtime:
#   max_projected_hours_maskrcnn: 14.0
#   fallback_n_videos: 8

# --- Mask R-CNN training (scripts/train_maskrcnn.py) ------------------------- #
# Scale jitter = random square crops of `crop_frac` x the long side, resized to
# `imgsz`, so both the full-frame and the Petri-crop scale are covered.
maskrcnn_training:
  imgsz: 640
  preresize_long_side: 1600
  crop_frac: [0.2, 1.0]
  instance_centered_fraction: 0.5   # half the crops centered on a larva
  min_instance_visible: 0.3         # drop instances <30% inside the crop
  hflip: 0.5
  color_jitter: {brightness: 0.4, contrast: 0.4, saturation: 0.7, hue: 0.015}
  batch: 4
  workers: 6
  max_epochs: 60
  patience: 60
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0001
  warmup_epochs: 1
  seed: 0
  val_imgsz: 640
  amp: true
