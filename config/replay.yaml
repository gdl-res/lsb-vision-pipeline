# Detection cache + offline replay configuration.
#
# Read by scripts/cache_detections.py and scripts/replay_trackers.py. The
# replay runs the unchanged downstream chain (primary-larva selection,
# continuity gate, interpolation, smoothing, kinematics, features, QC) over a
# cache of raw detections, for one or more association methods and gate states.
# With the default segmenter and `bytetrack__gate_on`, it reproduces the
# pipeline's own tables.

experiment_id: replay

paths:
  videos: data/videos
  # a run_pipeline.py output for the same videos (read-only): supplies the
  # frozen arena geometry per video (_work/<video>/petri_tracks.csv)
  dataset: outputs/my_dataset
  larva_model: weights/larva.pt
  cache: outputs/detection_cache
  out: outputs/replay

layout:
  rows: 3
  cols: 2

# --- detector pass (scripts/cache_detections.py) --------------------------- #
detection:
  # Cache floor = the lowest threshold any tracker consults
  # (bytetrack.yaml track_low_thresh: 0.1).
  cache_conf: 0.10
  iou: 0.50
  imgsz: 640
  petri_diameter_mm: 90.0

# --- replay (scripts/replay_trackers.py) ----------------------------------- #
replay:
  # equal to the pipeline's --larva-conf
  det_conf: 0.25
  low_conf_threshold: 0.40
  area_min_px: null
  area_max_px: null
  # ultralytics hardcodes frame_rate=30 in trackers/track.py regardless of the
  # true fps (max_time_lost = track_buffer = 30 frames); reproduced here.
  tracker_frame_rate: 30
  gate_on:
    max_jump_px: 60.0
    max_jump_growth_px: 5.0
    max_jump_cap_px: 240.0
  gate_off:
    # max_jump_px 0 short-circuits plausible_jump() to True
    max_jump_px: 0.0
    max_jump_growth_px: 0.0
    max_jump_cap_px: null

# Association methods x gate states. "nearest" is the tracker-free baseline:
# a null associator that emits no track ids.
methods: [bytetrack, botsort, ocsort, nearest]
gates: [gate_on, gate_off]

# --- downstream chain ------------------------------------------------------- #
downstream:
  max_interp_gap_s: 0.5
  smoothing_filter: savgol
  smoothing_window: 7
  savgol_polyorder: 2
  immobility_speed_threshold_mm_s: 1.0
  window_size_s: 60.0
  heatmap_bins: 50
  rim_occlusion_r: 0.85
  qc:
    min_valid_fraction: 0.40
    max_missing_gap_s: 60.0
    max_fraction_outside: 0.30
    max_step_norm: 0.5
    max_semantic_switch_rate_per_min: 6.0
    max_track_switch_rate_per_min: null
